name: Android APK (.NET 10)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Build unsigned APK
        run: dotnet publish SpineViewer.Android/SpineViewer.Android.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpineViewer-Android-unsigned
          path: '**/publish/*.apk'
          if-no-files-found: error
