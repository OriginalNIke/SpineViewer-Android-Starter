name: Android APK (.NET 10)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Build Vulkan native library (arm64-v8a)
        run: |
          cmake -S SpineViewer.Android/Platforms/Android/VulkanNative -B build-vulkan \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vulkan --config Release
          mkdir -p SpineViewer.Android/Platforms/Android/jniLibs/arm64-v8a
          cp build-vulkan/libspine_vulkan.so SpineViewer.Android/Platforms/Android/jniLibs/arm64-v8a/
      - name: Build unsigned APK
        run: dotnet publish SpineViewer.Android/SpineViewer.Android.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpineViewer-Android-unsigned
          path: '**/publish/*.apk'
          if-no-files-found: error
